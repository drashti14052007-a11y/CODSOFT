<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — LUXE</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .detail-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      padding: 60px 64px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .detail-img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      background: var(--gray-light);
    }
    .detail-info h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem;
      font-weight: 400;
      margin-bottom: 12px;
    }
    .detail-price {
      color: var(--gold);
      font-size: 1.4rem;
      font-weight: 500;
      margin-bottom: 20px;
    }
    .detail-desc {
      font-size: 0.8rem;
      line-height: 1.8;
      color: #555;
      margin-bottom: 28px;
    }
    .select-label {
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .size-options { display: flex; gap: 10px; margin-bottom: 28px; }
    .size-btn {
      width: 46px; height: 46px;
      border: 1.5px solid #ccc;
      background: var(--white);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .size-btn.active, .size-btn:hover {
      background: var(--black);
      color: var(--white);
      border-color: var(--black);
    }
    .qty-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .qty-label { font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }
    .qty-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .qty-btn.plus { background: var(--black); color: var(--white); }
    .qty-btn.minus { background: #eee; color: var(--black); }
    .qty-btn:hover { opacity: 0.8; }
    #qty-display { font-size: 0.9rem; min-width: 24px; text-align: center; font-weight: 500; }
    .action-row { display: flex; gap: 16px; margin-bottom: 32px; }
    .divider { border: none; border-top: 1px solid #eee; margin: 24px 0; }
    .meta-row {
      font-size: 0.72rem;
      letter-spacing: 1px;
      color: var(--gray);
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .meta-row span { text-transform: uppercase; }
    .share-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 16px 0;
    }
    .share-label { font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }
    .share-btn {
      padding: 9px 18px;
      border: 1.5px solid var(--black);
      background: transparent;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }
    .share-btn:hover { background: var(--black); color: var(--white); }
    .rating-box {
      border: 1px solid #ddd;
      border-radius: 2px;
      padding: 20px 28px;
      margin-top: 24px;
      text-align: center;
    }
    .rating-box .big-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 400;
      margin-bottom: 6px;
    }
    .stars { color: #f5a623; font-size: 1rem; letter-spacing: 4px; }
    .review-count { font-size: 0.68rem; letter-spacing: 1px; color: var(--gray); margin-top: 4px; }

    /* SEE MORE */
    .see-more { padding: 60px 64px; }
    .see-more-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: 2px;
      margin-bottom: 36px;
    }

    /* Toast */
    #toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: var(--black); color: var(--white);
      padding: 14px 28px; font-size: 0.75rem; letter-spacing: 1px;
      border-radius: 2px; display: none; z-index: 999;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)} }

    @media(max-width:768px) {
      .detail-wrap { grid-template-columns: 1fr; padding: 32px 20px; gap: 32px; }
      .see-more { padding: 40px 20px; }
      .action-row { flex-direction: column; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">LUXE</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
  <a href="cart.html" class="nav-cart">
    🛒<span class="cart-count" style="display:none">0</span>
  </a>
</nav>

<div class="detail-wrap" id="detail-wrap"></div>

<section class="see-more" id="see-more">
  <h2 class="see-more-title">SEE MORE ></h2>
  <div class="product-grid" id="see-more-grid"></div>
</section>

<footer><p>© 2025 Luxe. All rights reserved.</p></footer>
<div id="toast">Added to cart ✓</div>

<script src="js/app.js"></script>
<script>
  const id = parseInt(new URLSearchParams(location.search).get('id')) || 9;
  const product = PRODUCTS.find(p => p.id === id) || PRODUCTS[0];
  let selectedSize = 'S';
  let qty = 1;

  document.title = product.name + ' — LUXE';

  document.getElementById('detail-wrap').innerHTML = `
    <div>
      <img class="detail-img" src="${product.img}" alt="${product.name}">
    </div>
    <div class="detail-info">
      <h1>${product.name}</h1>
      <p class="detail-price">$${product.price}.00</p>
      <p class="detail-desc">${product.desc}</p>

      <p class="select-label">Select Size</p>
      <div class="size-options" id="size-opts">
        ${['S','M','L','XL'].map(s => `<button class="size-btn${s==='S'?' active':''}" data-size="${s}">${s}</button>`).join('')}
      </div>

      <div class="qty-wrap">
        <span class="qty-label">Quantity</span>
        <button class="qty-btn plus" id="qplus">+</button>
        <span id="qty-display">1</span>
        <button class="qty-btn minus" id="qminus">−</button>
      </div>

      <div class="action-row">
        <button class="btn-primary" id="add-btn">Add to Cart 🛒</button>
        <button class="btn-outline" onclick="window.location.href='cart.html'">BUY IT NOW</button>
      </div>

      <hr class="divider">
      <div class="meta-row">
        <span>SKU: ${product.sku}</span>
        <span>TAGS: ${product.tags.join(', ')}</span>
        <span>(${product.rating} FROM ${product.reviews} REVIEWS)</span>
      </div>

      <div class="share-row">
        <span class="share-label">SHARE</span>
        <button class="share-btn" onclick="navigator.share ? navigator.share({title:'${product.name}',url:location.href}) : alert('Link copied!')">INSTAGRAM</button>
        <span style="font-size:0.7rem;color:var(--gray);letter-spacing:1px">OR</span>
        <button class="share-btn" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href))">FACEBOOK</button>
      </div>

      <div class="rating-box">
        <p class="big-num">${product.rating} OUT OF 5</p>
        <p class="stars">${'★'.repeat(Math.round(product.rating))}${'☆'.repeat(5-Math.round(product.rating))}</p>
        <p class="review-count">(${product.reviews} REVIEWS)</p>
      </div>
    </div>
  `;

  // Size selection
  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedSize = btn.dataset.size;
    });
  });

  // Qty
  document.getElementById('qplus').addEventListener('click', () => {
    qty++; document.getElementById('qty-display').textContent = qty;
  });
  document.getElementById('qminus').addEventListener('click', () => {
    if (qty > 1) { qty--; document.getElementById('qty-display').textContent = qty; }
  });

  // Add to cart
  document.getElementById('add-btn').addEventListener('click', () => {
    addToCart(product.id, selectedSize, qty);
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 2000);
  });

  // See more
  const more = PRODUCTS.filter(p => p.id !== product.id && p.category === product.category).slice(0,3);
  const grid = document.getElementById('see-more-grid');
  grid.style.gridTemplateColumns = 'repeat(3,1fr)';
  more.forEach(p => grid.appendChild(renderCard(p)));
</script>
</body>
</html>
