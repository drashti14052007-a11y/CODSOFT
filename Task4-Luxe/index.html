<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXE — Fashion E-Commerce</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .hero {
      position: relative;
      height: calc(100vh - 64px);
      min-height: 500px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background: url('https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=1600&q=80') center/cover no-repeat;
      filter: brightness(0.5);
    }
    .hero-content {
      position: relative; z-index: 2; color: #fff;
      animation: fadeUp 0.9s ease both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(30px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 7vw, 5.5rem);
      font-weight: 300;
      letter-spacing: 4px;
      line-height: 1.1;
      margin-bottom: 14px;
    }
    .hero p {
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
      margin-bottom: 32px;
    }
    .featured { padding: 80px 64px; }
    .banner {
      position: relative;
      height: 360px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .banner-bg {
      position: absolute; inset: 0;
      background: url('https://images.unsplash.com/photo-1611591437281-460bfbe1220a?w=1600&q=80') center/cover no-repeat;
      filter: brightness(0.4);
    }
    .banner-content { position: relative; z-index: 2; color: #fff; }
    .banner h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 300;
      letter-spacing: 12px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .banner p {
      font-size: 0.68rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
      margin-bottom: 24px;
    }
    @media(max-width:768px){ .featured{ padding:48px 20px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">LUXE</a>
  <ul class="nav-links">
    <li><a href="index.html" class="active">Home</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
  <div class="nav-right">
    <a href="cart.html" class="nav-cart">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      <span class="cart-count">0</span>
    </a>
  </div>
</nav>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <h1>Dress to Impress</h1>
    <p>Explore the latest luxury fashion collection</p>
    <a href="shop.html" class="btn-primary">Shop Now &nbsp;🛍</a>
  </div>
</section>

<section class="featured">
  <h2 class="section-title">Featured Products</h2>
  <div class="product-grid" id="featured-grid"></div>
</section>

<div class="banner">
  <div class="banner-bg"></div>
  <div class="banner-content">
    <h2>Accessories</h2>
    <p>Find Your Vibe</p>
    <a href="shop.html?cat=accessories" class="btn-primary">Shop &nbsp;🛍</a>
  </div>
</div>

<footer><p>© 2025 Luxe. All rights reserved.</p></footer>

<script src="app.js"></script>
<script>
  const grid = document.getElementById('featured-grid');
  [21,22,23,24].map(id => PRODUCTS.find(p=>p.id===id)).forEach(p => grid.appendChild(renderCard(p)));
</script>
</body>
</html>
