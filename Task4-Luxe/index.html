<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXE — Fashion E-Commerce</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* HERO */
    .hero {
      position: relative;
      height: calc(100vh - 64px);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background: url('https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=1600&q=80') center/cover no-repeat;
      filter: brightness(0.55);
    }
    .hero-content {
      position: relative;
      z-index: 2;
      color: var(--white);
      animation: fadeUp 0.9s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 7vw, 6rem);
      font-weight: 300;
      letter-spacing: 4px;
      line-height: 1.1;
      margin-bottom: 16px;
    }
    .hero p {
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
      margin-bottom: 36px;
    }
    /* FEATURED */
    .featured { padding: 80px 48px; background: var(--white); }
    /* BANNER */
    .banner {
      position: relative;
      height: 380px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .banner-bg {
      position: absolute; inset: 0;
      background: url('https://images.unsplash.com/photo-1611591437281-460bfbe1220a?w=1600&q=80') center/cover no-repeat;
      filter: brightness(0.45);
    }
    .banner-content {
      position: relative; z-index: 2; color: var(--white);
    }
    .banner h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 300;
      letter-spacing: 10px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .banner p {
      font-size: 0.7rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      margin-bottom: 28px;
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">LUXE</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
  <a href="cart.html" class="nav-cart">
    🛒
    <span class="cart-count" style="display:none">0</span>
  </a>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <h1>Dress to Impress</h1>
    <p>Explore the latest luxury fashion collection</p>
    <a href="shop.html" class="btn-primary">Shop Now 🛍</a>
  </div>
</section>

<!-- FEATURED PRODUCTS -->
<section class="featured">
  <h2 class="section-title">Featured Products</h2>
  <div class="product-grid" id="featured-grid"></div>
</section>

<!-- ACCESSORIES BANNER -->
<div class="banner">
  <div class="banner-bg"></div>
  <div class="banner-content">
    <h2>Accessories</h2>
    <p>Find Your Vibe</p>
    <a href="shop.html?cat=accessories" class="btn-primary">Shop 🛍</a>
  </div>
</div>

<footer>
  <p>© 2025 Luxe. All rights reserved.</p>
</footer>

<script src="js/app.js"></script>
<script>
  const featured = PRODUCTS.filter(p => [21,22,23,24].includes(p.id));
  const grid = document.getElementById('featured-grid');
  featured.forEach(p => grid.appendChild(renderCard(p)));
</script>
</body>
</html>
