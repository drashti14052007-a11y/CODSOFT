<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AuthFlow — CodSoft Internship Task 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./style.css"/>
</head>
<body>

  <!-- PHONE WRAPPER -->
  <div class="phone">

    <!-- SCREEN 1: WELCOME -->
    <div class="screen active" id="screen-welcome">
      <div class="status-bar"><span>9:41</span><span>⚡ 100%</span></div>
      <div class="card">
        <div class="logo-row">
          <div class="logo-circle">A</div>
          <div>
            <h1 class="app-name">AuthFlow</h1>
          </div>
        </div>
        <p class="tagline">Your journey starts here.</p>

        <div class="btn-group">
          <button class="btn btn-primary" onclick="goTo('screen-signup')">Sign Up</button>
          <button class="btn btn-outline" onclick="goTo('screen-login')">Log In</button>
        </div>

        <p class="divider-text">or continue with</p>

        <div class="social-row">
          <button class="btn-social">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google
          </button>
          <button class="btn-social">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            Facebook
          </button>
        </div>
      </div>
    </div>

    <!-- SCREEN 2: SIGN UP -->
    <div class="screen" id="screen-signup">
      <div class="status-bar"><span>9:41</span><span>⚡ 100%</span></div>
      <div class="card">
        <button class="back-btn" onclick="goTo('screen-welcome')">← Back</button>
        <h2 class="screen-title">Create Account</h2>
        <p class="screen-sub">Fill in your details to get started</p>

        <div class="field-group">
          <label>Full Name</label>
          <input type="text" placeholder="Enter your full name" />
        </div>

        <div class="field-group">
          <label>Email Address</label>
          <input type="email" placeholder="Enter your email" />
        </div>

        <div class="field-group">
          <label>Password</label>
          <div class="input-wrapper">
            <input type="password" id="signup-password" placeholder="Enter your password" />
            <button class="eye-btn" onclick="togglePassword('signup-password', this)">👁</button>
          </div>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="privacy" />
          <label for="privacy">I agree to the <span class="link">Privacy Policy</span></label>
        </div>

        <button class="btn btn-primary" onclick="goTo('screen-login')">Create Account</button>

        <p class="bottom-link">Already have an account? <span class="link" onclick="goTo('screen-login')">Log In</span></p>
      </div>
    </div>

    <!-- SCREEN 3: LOGIN -->
    <div class="screen" id="screen-login">
      <div class="status-bar"><span>9:41</span><span>⚡ 100%</span></div>
      <div class="card">
        <button class="back-btn" onclick="goTo('screen-welcome')">← Back</button>
        <h2 class="screen-title">Welcome Back</h2>
        <p class="screen-sub">Log in to your account</p>

        <div class="field-group">
          <label>Email Address</label>
          <input type="email" placeholder="Enter your email" />
        </div>

        <div class="field-group">
          <label>Password</label>
          <div class="input-wrapper">
            <input type="password" id="login-password" placeholder="Enter your password" />
            <button class="eye-btn" onclick="togglePassword('login-password', this)">👁</button>
          </div>
          <div class="forgot-row">
            <span class="link">Forgot Password?</span>
          </div>
        </div>

        <button class="btn btn-primary">Log In</button>

        <p class="bottom-link">Don't have an account? <span class="link" onclick="goTo('screen-signup')">Sign Up</span></p>
      </div>
    </div>

  </div><!-- end phone -->

  <script src="./app.js"></script>
</body>
</html>
