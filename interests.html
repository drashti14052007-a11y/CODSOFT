<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Tell us what you're into — personalize your AuthFlow experience." />
  <meta name="theme-color" content="#5B8DEF" />
  <title>AuthFlow — Your Interests</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-transition" id="pageTransition"></div>

  <div class="app-shell">
    <div class="screen">

      <!-- Nav -->
      <nav class="nav-bar animate-fade-in">
        <button class="btn-back" id="btnBack" onclick="navigateTo('otp.html')" aria-label="Go back">
          <i class="ri-arrow-left-s-line"></i>
        </button>
        <span class="nav-title">Personalize</span>
      </nav>

      <!-- Header -->
      <div class="screen-header text-center animate-fade-in-up delay-1">
        <h1 class="heading-screen">What Excites You?</h1>
        <p class="text-body" style="color:var(--text-secondary);">
          Choose 3 or more topics to personalize your feed and recommendations.
        </p>
      </div>

      <!-- Interests Grid -->
      <div class="auth-card animate-fade-in-up delay-2" style="padding: 24px 20px;">
        <div class="interests-grid" id="interestsGrid">
          <!-- Chips are generated by JS, but also static fallback -->
          <button class="interest-chip" data-interest="technology" type="button">
            <i class="ri-code-s-slash-line"></i> Technology
          </button>
          <button class="interest-chip" data-interest="gaming" type="button">
            <i class="ri-gamepad-line"></i> Gaming
          </button>
          <button class="interest-chip" data-interest="sports" type="button">
            <i class="ri-basketball-line"></i> Sports
          </button>
          <button class="interest-chip" data-interest="music" type="button">
            <i class="ri-music-2-line"></i> Music
          </button>
          <button class="interest-chip" data-interest="fashion" type="button">
            <i class="ri-t-shirt-line"></i> Fashion
          </button>
          <button class="interest-chip" data-interest="art" type="button">
            <i class="ri-palette-line"></i> Art
          </button>
          <button class="interest-chip" data-interest="photography" type="button">
            <i class="ri-camera-line"></i> Photography
          </button>
          <button class="interest-chip" data-interest="travel" type="button">
            <i class="ri-plane-line"></i> Travel
          </button>
          <button class="interest-chip" data-interest="food" type="button">
            <i class="ri-restaurant-line"></i> Food
          </button>
          <button class="interest-chip" data-interest="fitness" type="button">
            <i class="ri-heart-pulse-line"></i> Fitness
          </button>
          <button class="interest-chip" data-interest="science" type="button">
            <i class="ri-flask-line"></i> Science
          </button>
          <button class="interest-chip" data-interest="movies" type="button">
            <i class="ri-film-line"></i> Movies
          </button>
        </div>

        <div class="interests-counter mt-lg" id="interestsCounter">
          <strong>0</strong> of 3+ selected
        </div>

        <button class="btn-primary disabled mt-sm" id="btnContinueInterests" disabled onclick="navigateTo('success.html')">
          <span class="btn-text">Continue</span>
          <div class="spinner"></div>
        </button>
      </div>

      <!-- Skip -->
      <div class="text-center mt-md animate-fade-in-up delay-4">
        <button class="btn-ghost" onclick="navigateTo('success.html')" style="width:auto;display:inline-flex;">
          Skip for now <i class="ri-arrow-right-line"></i>
        </button>
      </div>

    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initInterestsScreen();
    });
  </script>
</body>
</html>
