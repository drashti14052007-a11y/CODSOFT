<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="AuthFlow — A premium authentication experience. Sign up or log in to start your journey." />
  <meta name="theme-color" content="#5B8DEF" />
  <title>AuthFlow — Welcome</title>

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════
       SPLASH SCREEN
       ═══════════════════════════════════════════ -->
  <div class="splash-screen" id="splashScreen">
    <div class="splash-logo">
      <div class="splash-logo-icon">
        <span class="splash-logo-letter">A</span>
      </div>
    </div>
    <p class="splash-brand">AuthFlow</p>
    <p class="splash-tagline">Your journey starts here.</p>
    <div class="splash-loader">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       PAGE TRANSITION OVERLAY
       ═══════════════════════════════════════════ -->
  <div class="page-transition" id="pageTransition"></div>

  <!-- ═══════════════════════════════════════════
       APP SHELL
       ═══════════════════════════════════════════ -->
  <div class="app-shell">
    <div class="screen screen--center">

      <!-- Hero / Brand Section -->
      <div class="welcome-hero">
        <div class="welcome-brand animate-scale-in">
          <div class="brand-logo">
            <span class="brand-logo-letter">A</span>
          </div>
          <h1 class="heading-hero welcome-title animate-fade-in-up delay-2">AuthFlow</h1>
        </div>
        <p class="text-body welcome-subtitle animate-fade-in-up delay-3">
          Your journey starts here.
        </p>
      </div>

      <!-- Bottom Card with CTA -->
      <div class="welcome-card auth-card animate-fade-in-up delay-4">
        <!-- CTA Buttons -->
        <div class="welcome-buttons">
          <button class="btn-primary" id="btnSignUp" onclick="navigateTo('signup.html')">
            <span class="btn-text">Sign Up</span>
          </button>

          <button class="btn-secondary" id="btnLogin" onclick="navigateTo('login.html')">
            <span>Log In</span>
          </button>
        </div>

        <!-- Divider -->
        <div class="divider">
          <span>or continue with</span>
        </div>

        <!-- Social Buttons Row -->
        <div class="social-buttons-row">
          <button class="btn-social" id="btnGoogle" type="button">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24.001 24.001 0 0 0 0 21.56l7.98-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Google
          </button>
          <span class="social-or">OR</span>
          <button class="btn-social" id="btnFacebook" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12S0 5.446 0 12.073c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            Facebook
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // ── Splash Screen Logic ──
    document.addEventListener('DOMContentLoaded', () => {
      const splash = document.getElementById('splashScreen');
      setTimeout(() => {
        splash.classList.add('hide');
        setTimeout(() => splash.remove(), 600);
      }, 2400);
    });
  </script>
</body>
</html>
