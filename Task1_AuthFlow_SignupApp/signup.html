<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Create your AuthFlow account — your journey starts here." />
  <meta name="theme-color" content="#5B8DEF" />
  <title>AuthFlow — Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-transition" id="pageTransition"></div>

  <div class="app-shell">
    <div class="screen">

      <!-- Nav -->
      <nav class="nav-bar animate-fade-in">
        <button class="btn-back" id="btnBack" onclick="navigateTo('index.html')" aria-label="Go back">
          <i class="ri-arrow-left-s-line"></i>
        </button>
        <span class="nav-title">Sign Up</span>
      </nav>

      <!-- Header -->
      <div class="screen-header animate-fade-in-up delay-1">
        <h1 class="heading-screen">Create Account</h1>
        <p class="text-body">Join AuthFlow and start your journey today.</p>
      </div>

      <!-- Auth Card -->
      <div class="auth-card animate-fade-in-up delay-2">
        <form id="signupForm" novalidate autocomplete="off">

          <!-- Full Name -->
          <div class="input-group" id="nameGroup">
            <input type="text" id="fullName" placeholder="Full Name" required autocomplete="name" />
            <label for="fullName"><i class="ri-user-line"></i> Full Name</label>
            <div class="input-error" id="nameError">
              <i class="ri-error-warning-line"></i>
              <span>Please enter your full name</span>
            </div>
          </div>

          <!-- Email -->
          <div class="input-group" id="emailGroup">
            <input type="email" id="email" placeholder="Email Address" required autocomplete="email" />
            <label for="email"><i class="ri-mail-line"></i> Email Address</label>
            <div class="input-error" id="emailError">
              <i class="ri-error-warning-line"></i>
              <span>Enter a valid email address</span>
            </div>
          </div>

          <!-- Password -->
          <div class="input-group" id="passwordGroup">
            <div class="password-wrapper">
              <input type="password" id="password" placeholder="Password" required autocomplete="new-password" />
              <label for="password"><i class="ri-lock-line"></i> Password</label>
              <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
                <i class="ri-eye-off-line"></i>
              </button>
            </div>
            <div class="password-strength" id="passwordStrength" style="display:none;">
              <div class="strength-bar-track">
                <div class="strength-bar-fill" id="strengthFill"></div>
              </div>
              <div class="strength-label" id="strengthLabel"></div>
            </div>
            <div class="input-error" id="passwordError">
              <i class="ri-error-warning-line"></i>
              <span>Password must be at least 8 characters</span>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="input-group" id="confirmGroup">
            <div class="password-wrapper">
              <input type="password" id="confirmPassword" placeholder="Confirm Password" required autocomplete="new-password" />
              <label for="confirmPassword"><i class="ri-lock-check-line"></i> Confirm Password</label>
              <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Show confirm password">
                <i class="ri-eye-off-line"></i>
              </button>
            </div>
            <div class="input-error" id="confirmError">
              <i class="ri-error-warning-line"></i>
              <span>Passwords do not match</span>
            </div>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn-primary disabled mt-md" id="btnSignup" disabled>
            <span class="btn-text">Create Account</span>
            <div class="spinner"></div>
          </button>
        </form>

        <!-- Divider -->
        <div class="divider">
          <span>or continue with</span>
        </div>

        <!-- Social Buttons -->
        <div class="social-buttons">
          <button class="btn-social" id="btnGoogle" type="button">
            <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24.001 24.001 0 0 0 0 21.56l7.98-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Continue with Google
          </button>
          <button class="btn-social" id="btnApple" type="button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
            Continue with Apple
          </button>
        </div>
      </div>

      <!-- Bottom Link -->
      <p class="form-bottom-text animate-fade-in-up delay-4">
        Already have an account? <a href="login.html" onclick="event.preventDefault(); navigateTo('login.html')">Log In</a>
      </p>

    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initSignupForm();
    });
  </script>
</body>
</html>
