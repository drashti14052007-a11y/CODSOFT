<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Verify your AuthFlow identity with a one-time code — fast and secure." />
  <meta name="theme-color" content="#5B8DEF" />
  <title>AuthFlow — Verify OTP</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-transition" id="pageTransition"></div>

  <div class="app-shell">
    <div class="screen">

      <!-- Nav -->
      <nav class="nav-bar animate-fade-in">
        <button class="btn-back" id="btnBack" onclick="navigateTo('signup.html')" aria-label="Go back">
          <i class="ri-arrow-left-s-line"></i>
        </button>
        <span class="nav-title">Verification</span>
      </nav>

      <!-- Header -->
      <div class="screen-header text-center animate-fade-in-up delay-1">
        <h1 class="heading-screen">Enter Code</h1>
        <p class="text-body" style="color:var(--text-secondary);">
          We sent a 6-digit verification code to<br />
          <strong style="color:var(--text-primary);">user@example.com</strong>
        </p>
      </div>

      <!-- Icon -->
      <div class="flex-center mb-lg animate-scale-in delay-2">
        <div style="width:88px;height:88px;border-radius:28px;background:var(--gradient-primary);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 36px rgba(91,141,239,0.25);">
          <i class="ri-shield-keyhole-line" style="font-size:40px;color:#fff;"></i>
        </div>
      </div>

      <!-- OTP Inputs -->
      <div class="auth-card animate-fade-in-up delay-3">
        <div class="otp-container" id="otpContainer">
          <input class="otp-input" type="text" inputmode="numeric" maxlength="1" data-index="0" id="otp-0" aria-label="Digit 1" autocomplete="one-time-code" />
          <input class="otp-input" type="text" inputmode="numeric" maxlength="1" data-index="1" id="otp-1" aria-label="Digit 2" />
          <input class="otp-input" type="text" inputmode="numeric" maxlength="1" data-index="2" id="otp-2" aria-label="Digit 3" />
          <input class="otp-input" type="text" inputmode="numeric" maxlength="1" data-index="3" id="otp-3" aria-label="Digit 4" />
          <input class="otp-input" type="text" inputmode="numeric" maxlength="1" data-index="4" id="otp-4" aria-label="Digit 5" />
          <input class="otp-input" type="text" inputmode="numeric" maxlength="1" data-index="5" id="otp-5" aria-label="Digit 6" />
        </div>

        <!-- Timer -->
        <div class="otp-timer" id="otpTimer">
          Resend code in <span class="timer-value" id="timerDisplay">01:30</span>
        </div>

        <!-- Resend -->
        <div class="text-center mb-md">
          <button class="btn-resend" id="btnResend" disabled>
            <i class="ri-refresh-line"></i> Resend Code
          </button>
        </div>

        <!-- Verify Button -->
        <button class="btn-primary disabled" id="btnVerify" disabled onclick="verifyOtp()">
          <span class="btn-text">Verify</span>
          <div class="spinner"></div>
        </button>
      </div>

    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initOtpScreen();
    });
  </script>
</body>
</html>
