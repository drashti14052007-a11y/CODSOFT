<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Reset your AuthFlow password — we'll get you back on track." />
  <meta name="theme-color" content="#5B8DEF" />
  <title>AuthFlow — Forgot Password</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-transition" id="pageTransition"></div>

  <div class="app-shell">
    <div class="screen">

      <!-- Nav -->
      <nav class="nav-bar animate-fade-in">
        <button class="btn-back" id="btnBack" onclick="navigateTo('login.html')" aria-label="Go back">
          <i class="ri-arrow-left-s-line"></i>
        </button>
        <span class="nav-title">Reset Password</span>
      </nav>

      <!-- Header -->
      <div class="screen-header animate-fade-in-up delay-1">
        <h1 class="heading-screen">Forgot Password?</h1>
        <p class="text-body">No worries — enter your email and we'll send you a reset link.</p>
      </div>

      <!-- Illustration / Icon -->
      <div class="flex-center mb-xl animate-scale-in delay-2">
        <div style="width:100px;height:100px;border-radius:32px;background:var(--gradient-primary);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 36px rgba(91,141,239,0.25);">
          <i class="ri-lock-unlock-line" style="font-size:44px;color:#fff;"></i>
        </div>
      </div>

      <!-- Auth Card -->
      <div class="auth-card animate-fade-in-up delay-3">

        <!-- Form view -->
        <form id="forgotForm" novalidate autocomplete="off">
          <div class="input-group" id="forgotEmailGroup">
            <input type="email" id="forgotEmail" placeholder="Email Address" required autocomplete="email" />
            <label for="forgotEmail"><i class="ri-mail-line"></i> Email Address</label>
            <div class="input-error" id="forgotEmailError">
              <i class="ri-error-warning-line"></i>
              <span>Enter a valid email address</span>
            </div>
          </div>

          <button type="submit" class="btn-primary disabled mt-md" id="btnReset" disabled>
            <span class="btn-text">Send Reset Link</span>
            <div class="spinner"></div>
          </button>
        </form>

        <!-- Success view (hidden by default) -->
        <div id="forgotSuccess" class="hidden" style="text-align:center; padding: 16px 0;">
          <div class="flex-center mb-md">
            <div style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#4ADE80,#34D399);display:flex;align-items:center;justify-content:center;">
              <i class="ri-mail-check-line" style="font-size:32px;color:#fff;"></i>
            </div>
          </div>
          <h2 class="heading-section mb-sm">Check Your Email</h2>
          <p class="text-body" style="color:var(--text-secondary);margin-bottom:24px;">
            We've sent a password reset link to <strong id="sentEmail"></strong>. Check your inbox and follow the instructions.
          </p>
          <button class="btn-primary" onclick="navigateTo('login.html')">
            <span class="btn-text">Back to Login</span>
          </button>
        </div>
      </div>

      <!-- Bottom Link -->
      <p class="form-bottom-text animate-fade-in-up delay-4">
        Remember your password? <a href="login.html" onclick="event.preventDefault(); navigateTo('login.html')">Log In</a>
      </p>

    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initForgotForm();
    });
  </script>
</body>
</html>
