<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="You're all set! Welcome aboard AuthFlow." />
  <meta name="theme-color" content="#5B8DEF" />
  <title>AuthFlow — All Set!</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-transition" id="pageTransition"></div>

  <div class="app-shell">
    <div class="screen screen--center">

      <div class="success-content">

        <!-- Animated Checkmark -->
        <div class="success-icon-wrap animate-scale-in">
          <svg class="checkmark-svg" viewBox="0 0 52 52">
            <circle class="checkmark-circle" cx="26" cy="26" r="25" />
            <path class="checkmark-check" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
          </svg>
        </div>

        <!-- Confetti Canvas -->
        <canvas id="confettiCanvas" style="position:fixed;inset:0;pointer-events:none;z-index:10;"></canvas>

        <!-- Text -->
        <h1 class="success-greeting animate-fade-in-up delay-3">You're All Set! 🎉</h1>
        <p class="success-message animate-fade-in-up delay-4">
          Your account is ready. Dive into the AuthFlow universe and discover what's next.
        </p>

        <!-- CTA -->
        <div class="animate-fade-in-up delay-5" style="width:100%;max-width:320px;">
          <button class="btn-primary" id="btnGetStarted" onclick="navigateTo('index.html')">
            <i class="ri-rocket-2-line"></i>
            <span class="btn-text">Get Started</span>
          </button>
        </div>

      </div>

    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      launchConfetti();
    });
  </script>
</body>
</html>
